<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal da Equipe · Meu Dente</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#060d14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap">
<style>
/* Portal da equipe: cada pessoa entra com usuário e senha e vê só a(s) sua(s) clínica(s).
   Os dados de cada conta vêm compactados e criptografados na página; só abrem com a senha certa.
   Tudo é calculado aqui a partir dos leads (sem dados de paciente), para qualquer período escolhido. */
:root{
  --bg:#060d14; --panel:#0c1a25; --panel2:#0f2231; --line:#1b3141; --line2:#264257; --ink:#08131c;
  --txt:#eaf2f6; --mut:#8ea4b3; --dim:#5f7787;
  --gold:#e3b55e; --gold2:#f4d48e; --blue:#3d8dff; --teal:#17b5b0; --green:#19d39c; --red:#ff6470; --amber:#f5a524; --violet:#a98bff;
  --f-display:"Sora","Manrope",system-ui,sans-serif; --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 var(--f-body);font-variant-numeric:tabular-nums;min-height:100vh;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:var(--txt)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none}
.muted{color:var(--mut)}

/* ---------- Login ---------- */
.entrada{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 50% -10%,#2a2111aa,transparent 70%),var(--bg)}
.caixa{width:100%;max-width:400px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:28px 22px}
.caixa .logo{display:block;width:190px;max-width:70%;height:auto;margin:0 auto 18px}
.caixa h1{font-family:var(--f-display);font-size:22px;margin:0;text-align:center;letter-spacing:-.2px}
.caixa .sub{color:var(--mut);text-align:center;margin:4px 0 22px;font-size:14px}
.campo{display:block;margin-bottom:14px}
.campo span{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:600}
.campo .inp{display:flex;align-items:center;background:var(--ink);border:1px solid var(--line2);border-radius:12px}
.campo .inp:focus-within{border-color:var(--gold)}
.campo input{flex:1;min-width:0;background:transparent;border:0;padding:13px 14px;font-size:16px;outline:none}
.olho{background:transparent;border:0;color:var(--mut);padding:0 12px;height:46px;display:grid;place-items:center}
.lembrar{display:flex;align-items:center;gap:9px;font-size:14px;color:#c9d6de;margin:4px 0 18px;cursor:pointer}
.lembrar input{width:18px;height:18px;accent-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);min-height:44px;padding:0 16px;font-weight:700}
.btn.gold{border-color:#7a5e26;color:#1b1406;background:linear-gradient(180deg,var(--gold2),var(--gold))}
.btn.full{width:100%;font-size:16px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px;font-weight:600}
.erro{background:#3a0f15;border:1px solid #7a2430;color:#ffb3b9;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.rodape{color:var(--dim);font-size:12.5px;text-align:center;margin-top:18px}
.cadeado{display:flex;gap:8px;align-items:flex-start;color:var(--mut);font-size:12.5px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.cadeado svg{width:16px;height:16px;color:var(--gold);flex:none;margin-top:1px}

/* ---------- Topo, período e abas ---------- */
.topo{position:sticky;top:0;z-index:20;background:#060d14f2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topo .in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.topo .logo{height:32px;width:auto}
.topo .quem{flex:1;min-width:0;text-align:right}
.topo .quem b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .quem small{color:var(--mut);font-size:12px}
.barra{max-width:1080px;margin:0 auto;padding:0 16px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.perBtn{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:6px 12px;min-height:44px;text-align:left;flex:1 1 220px;min-width:0}
.perBtn svg{color:var(--gold)}
.perBtn small{display:block;color:var(--mut);font-size:11px}
.perBtn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perBtn .chev{margin-left:auto;color:var(--mut)}
.clinSel{background:var(--panel);border:1px solid var(--line2);border-radius:12px;min-height:44px;padding:0 12px;font-weight:700;flex:0 1 auto;max-width:100%}
.clinSel option{background:var(--panel)}
.abas{max-width:1080px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{flex:none;background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-weight:700;color:var(--mut);font-size:14px}
.abas button.on{color:var(--gold2);border-bottom-color:var(--gold)}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 70px;display:flex;flex-direction:column;gap:14px}

/* ---------- Cartões ---------- */
.card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.cklink{display:flex;align-items:center;gap:14px;justify-content:space-between;border:1px solid #7a5e26;border-radius:18px;padding:14px 16px;margin-bottom:12px;background:linear-gradient(160deg,#2a2111,#15120b);text-decoration:none;color:inherit}.cklink b{display:block;color:var(--gold2);font-size:16px}.cklink small{display:block;color:var(--mut);font-size:13px;margin-top:3px;line-height:1.4}.cklink i{font-style:normal;font-size:22px;color:var(--gold2);flex:none}
.chead{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.chead>svg{color:var(--gold);margin-top:1px}
.chead h3{font-family:var(--f-display);font-size:16px;margin:0;letter-spacing:-.1px}
.chead small{display:block;color:var(--mut);font-size:12.5px;font-family:var(--f-body);font-weight:500}
.g2{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:860px){.g2{grid-template-columns:1fr 1fr}.g2.l{grid-template-columns:1.3fr 1fr}}
.hero{border-color:#4d3d1c;background:radial-gradient(520px 220px at 0% 0%,#2a211166,transparent 70%),linear-gradient(160deg,var(--panel2),var(--panel))}
.big small{display:block;color:var(--mut);font-size:13px;font-weight:600}
.big b{display:block;font-family:var(--f-display);font-size:34px;line-height:1.1;color:var(--gold2);letter-spacing:-.5px;margin-top:2px}
.delta{font-size:12.5px;color:var(--mut);margin-top:4px}
.up{color:var(--green);font-weight:700}.dn{color:var(--red);font-weight:700}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
@media (min-width:520px){.mini{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mini div{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0}
.mini small{display:block;color:var(--mut);font-size:12px}
.mini b{display:block;font-size:20px;font-family:var(--f-display);margin-top:1px}
.mini em{display:block;font-style:normal;font-size:11.5px;color:var(--mut)}
.pos{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.pos svg{color:var(--gold)}
.com b.v{display:block;font-family:var(--f-display);font-size:32px;color:var(--green);letter-spacing:-.4px}
.lin{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.lin:last-child{border-bottom:0}
.lin span{color:#c9d6de}
.nota{color:var(--mut);font-size:12.5px;margin:10px 0 0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:860px){.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}}
.kpi{background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.kpi small{display:block;color:var(--mut);font-size:12.5px;font-weight:600}
.kpi b{display:block;font-family:var(--f-display);font-size:23px;margin:2px 0 3px}
.kpi .ctx{font-size:12px;color:var(--mut)}
.kpi .delta{font-size:12px;margin-top:0}
.kpi.ent{grid-column:1/-1}
@media (min-width:860px){.kpi.ent{grid-column:auto}}
.kpi.ent b{color:var(--gold2)}
.meta{height:7px;border-radius:9px;background:#1a2c3a;position:relative;margin-top:8px}
.meta i{position:absolute;left:0;top:0;bottom:0;border-radius:9px}
.meta em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--txt);opacity:.75;border-radius:2px}
.todo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:640px){.todo{grid-template-columns:repeat(4,minmax(0,1fr))}}
.todo div{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.todo b{display:block;font-family:var(--f-display);font-size:22px}
.todo span{font-size:12.5px;color:var(--mut)}
.todo .a b{color:var(--amber)}.todo .r b{color:var(--red)}.todo .b b{color:#8fb9ff}.todo .v b{color:var(--violet)}
.funil .row{display:grid;grid-template-columns:108px 1fr 104px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.funil .bar{height:22px;border-radius:7px;background:#12263a;overflow:hidden}
.funil .bar i{display:block;height:100%;border-radius:7px}
.funil .row b{text-align:right}
.funil .row b small{display:block;color:var(--mut);font-weight:500;font-size:11.5px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--mut);font-weight:600;font-size:11.5px;text-align:left;padding:7px 6px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th.n,td.n{text-align:right}
tr.eu td{background:#2a211140}
tr.tot td{font-weight:800;border-bottom:0}
.gb{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.gb.leads{background:#1c2f52;color:#9cc2ff}.gb.comercial{background:#173b33;color:#7ff0cc}
.hb{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px}
.hb span{flex:0 0 132px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bar{flex:1;height:10px;border-radius:9px;background:#12263a;overflow:hidden}
.hb .bar i{display:block;height:100%;border-radius:9px}
.hb b{flex:0 0 44px;text-align:right}
.graf{width:100%;height:auto;display:block}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.vazio{color:var(--mut);font-size:14px;text-align:center;padding:16px 8px}
.ola h2{font-family:var(--f-display);font-size:21px;margin:0;letter-spacing:-.2px}
.ola p{margin:2px 0 0;color:var(--mut);font-size:13.5px}
.vcurto{display:none}.tcrc{min-width:620px}.tcrc td:nth-child(2){white-space:normal}
tr.lnk{cursor:pointer}tr.lnk:hover td{background:#12263a}
@media (max-width:520px){.torig .op,.tclin .op,.tcrc .op{display:none}.tcrc{min-width:0}.tclin .vfull,.tcrc .vfull{display:none}.tclin .vcurto,.tcrc .vcurto{display:inline}.tclin td,.tclin th{padding-left:4px;padding-right:4px}.torig td,.torig th{padding-left:4px;padding-right:4px}}
.fim{color:var(--dim);font-size:12px;text-align:center;margin-top:4px}

/* ---------- Seletor de período ---------- */
.veu{position:fixed;inset:0;background:#000a;z-index:40}
.folha{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.folha{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:440px;border-radius:20px}}
.folha h3{font-family:var(--f-display);margin:0 0 12px;font-size:17px}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.presets button{background:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:10px;font-weight:600;font-size:13.5px}
.presets button.on{border-color:#7a5e26;color:var(--gold2)}
.cal{background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calh b{font-size:14px}
.calh button{background:transparent;border:1px solid var(--line2);border-radius:9px;width:36px;height:34px;font-size:18px}
.calh button:disabled{opacity:.3}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calg .ds{font-size:11px;color:var(--dim);padding:4px 0}
.calg button{background:transparent;border:0;border-radius:8px;height:38px;font-size:14px}
.calg button:disabled{color:#33495a;cursor:default}
.calg button.in{background:#2a211188;border-radius:0}
.calg button.ex{background:var(--gold);color:#1b1406;font-weight:800;border-radius:8px}
.calg button.hj{box-shadow:inset 0 0 0 1px var(--line2)}
.selinfo{font-size:13px;color:var(--mut);margin:10px 0}
.folha .acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
</style>
</head>

  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: sal, iterations: D.kdf.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}

async function entrar(ev) {

  if (!u.trim() || !s) { mostrarErro('Preencha usuário e senha.'); return; }
  if (!suportado()) { mostrarErro('Este navegador é antigo demais para abrir o portal. Atualize o navegador do celular ou use o Chrome.'); return; }
  const bt = $('entrar'); bt.disabled = true; bt.textContent = 'Conferindo…';
  try {
    const id = await idConta(u), env = D.contas[id];
    const chave = await chaveDaSenha(s, env ? b64(env.s) : new Uint8Array(16));
    if (!env) throw new Error('x');

  } catch (e) {

  } finally { bt.disabled = false; bt.textContent = 'Entrar'; }
}

/* ---------- Datas (dias contados a partir do primeiro dia com dados) ---------- */
const deIso = (s) => { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); };
const diaD = (o) => new Date(D0.getFullYear(), D0.getMonth(), D0.getDate() + o);
const offD = (dt) => Math.round((new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()) - D0) / 864e5);
const fmt = (o, ano) => { const d = diaD(o); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + (ano ? '/' + d.getFullYear() : ''); };
const maxOff = () => offD(deIso(P.max));
function presets() {
  const mx = maxOff(), hj = diaD(mx), y = hj.getFullYear(), m = hj.getMonth();
  const cl = (a, b) => [Math.max(0, a), Math.min(mx, b)];
  return [
    ['mes', 'Este mês', cl(offD(new Date(y, m, 1)), mx)],
    ['mesant', 'Mês passado', cl(offD(new Date(y, m - 1, 1)), offD(new Date(y, m, 0)))],
    ['7d', 'Últimos 7 dias', cl(mx - 6, mx)],
    ['30d', 'Últimos 30 dias', cl(mx - 29, mx)],

const noPer = (L, a, b) => L.filter(x => x[0] >= a && x[0] <= b);
function agreg(L) {
  const t = { l: 0, ag: 0, cp: 0, c: 0, v: 0, t1: 0, t2: 0, t3: 0, t4: 0 };
  for (const x of L) { t.l++; if (x[5] > 0) t.ag++; if (x[7] || x[4] === 5) t.cp++; if (x[7]) t.c++; t.v += x[6]; if (!x[7]) { if (x[4] === 1) t.t1++; else if (x[4] === 2) t.t2++; else if (x[4] === 3) t.t3++; else if (x[4] === 4) t.t4++; } }
  return t;
}
const anterior = () => { const n = per[1] - per[0] + 1, a = per[0] - n; return a >= 0 ? [a, per[0] - 1] : null; };
function comissao(R, t) {
  if (!R) return null; const s = R.comp + R.fech + R.pct; if (!s) return null;
  const comp = R.comp * t.cp, fech = R.fech * t.c, pc = R.pct / 100 * t.v;
  return { comp, fech, pc, total: comp + fech + pc, R };
}

  return [...m.entries()].map(([i, ls]) => ({ i, p: c.p[i] || {}, t: agreg(ls) }));
}

function grafDias(L, titulo, sub) {

  for (const x of L) { const i = x[0] - a; if (i >= 0 && i < n) { lead[i]++; if (x[7]) fech[i]++; } }
  const W = Math.max(300, Math.min(980, ($('conteudo').clientWidth || 640) - 36)), H = W < 520 ? 170 : 200, pl = 28, pb = 22, pt = 8, mx = Math.max(1, ...lead), bw = (W - pl - 6) / n;

    s += `<rect x="${x}" y="${yy(lead[i])}" width="${w}" height="${H - pb - yy(lead[i])}" rx="2" fill="${fds ? '#2b4f86' : '#3d8dff'}"><title>${fmt(a + i)}: ${lead[i]} leads, ${fech[i]} fecharam</title></rect>`;
    if (fech[i]) s += `<rect x="${x}" y="${yy(fech[i])}" width="${w}" height="${H - pb - yy(fech[i])}" rx="2" fill="#e3b55e"><title>${fmt(a + i)}: ${fech[i]} fecharam</title></rect>`;
    if (i % passo === 0) s += `<text x="${x + w / 2}" y="${H - 7}" fill="#8ea4b3" font-size="11" text-anchor="middle">${fmt(a + i)}</text>`;
  }

  return `<section class="card"><div class="chead">${icon('building')}<h3>Clínicas da rede<small>${rotPer()} · ordenado por entradas · toque numa clínica para abrir</small></h3></div>
    <div class="tbl"><table class="tclin"><thead><tr><th>Clínica</th><th class="n">Leads</th><th class="n op">Compareceram</th><th class="n">Fecharam</th><th class="n op">Conversão</th><th class="n">Entradas</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="lnk" data-ir="${r.i}" tabindex="0"><td><b>${esc(r.c.nome)}</b></td><td class="n">${num(r.t.l)}</td><td class="n op">${num(r.t.cp)} · ${pc(pct(r.t.cp, r.t.l), M.comparecimentoPct)}</td><td class="n">${num(r.t.c)}<small style="display:block">${pc(pct(r.t.c, r.t.cp), M.fechamentoPct)}</small></td><td class="n op">${pf(pct(r.t.c, r.t.l))}</td><td class="n" style="color:var(--gold2)">${brlC(r.t.v)}${r.a && r.a.v >= 500 ? `<small style="display:block" class="${r.t.v >= r.a.v ? 'up' : 'dn'}">${r.t.v >= r.a.v ? '▲' : '▼'} ${pf(Math.abs((r.t.v - r.a.v) / r.a.v * 100))}</small>` : ''}</td></tr>`).join('')}
    <tr class="tot"><td>Rede</td><td class="n">${num(T.l)}</td><td class="n op">${num(T.cp)} · ${pf(pct(T.cp, T.l))}</td><td class="n">${num(T.c)}<small style="display:block">${pf(pct(T.c, T.cp))}</small></td><td class="n op">${pf(pct(T.c, T.l))}</td><td class="n" style="color:var(--gold2)">${brlC(T.v)}</td></tr>
    </tbody></table></div><p class="nota">Compareceram: % dos leads (meta ${M.comparecimentoPct}%). Fecharam: % dos presentes (meta ${M.fechamentoPct}%).${A ? ' A setinha compara as entradas com o mesmo número de dias logo antes.' : ''}</p></section>`;
}
function cardRankingRede(todos) {
  const m = new Map();
  todos.forEach(c => porPessoa(c, noPer(c.L, per[0], per[1])).forEach(x => {
    if (!x.p.crc) return;
    const k = x.p.k || (c.id + ':' + x.i), o = m.get(k) || { n: x.p.n || 'Sem nome', g: x.p.g, cl: [], l: 0, cp: 0, c: 0, v: 0, com: 0, temCom: false };
    o.cl.push(c.nome); o.l += x.t.l; o.cp += x.t.cp; o.c += x.t.c; o.v += x.t.v;
    const k2 = x.p.g ? comissao(c.r[x.p.g], x.t) : null; if (k2) { o.com += k2.total; o.temCom = true; }
    m.set(k, o);
  }));
  const ps = [...m.values()].filter(p => p.l > 0).sort((a, b) => b.v - a.v || b.c - a.c);
  if (!ps.length) return '<section class="card"><p class="vazio">Nenhum CRC com leads neste período.</p></section>';
  const temK = ps.some(p => p.temCom);
  return `<section class="card"><div class="chead">${icon('trophy')}<h3>CRCs da rede<small>${rotPer()} · CRC Leads e CRC Comercial, ordenado por faturamento</small></h3></div>
    <div class="tbl"><table class="tcrc"><thead><tr><th class="op">#</th><th>Pessoa</th><th class="n op">Leads</th><th class="n">Fech.</th><th class="n op">Conversão</th><th class="n">Faturamento</th>${temK ? '<th class="n">Comissão est.</th>' : ''}</tr></thead><tbody>
    ${ps.map((p, i) => `<tr><td class="muted op">${i + 1}º</td><td><b>${esc(p.n)}</b>${p.g ? `<span class="gb ${p.g}">${NG[p.g]}</span>` : ''}<small style="display:block" class="muted">${esc([...new Set(p.cl)].join(', '))}</small></td><td class="n op">${num(p.l)}</td><td class="n">${num(p.c)}<small style="display:block" class="muted">de ${num(p.l)}</small></td><td class="n op">${pf(pct(p.c, p.l))}</td><td class="n" style="color:var(--gold2)">${brlC(p.v)}</td>${temK ? `<td class="n" style="color:var(--green)">${p.temCom ? brl2(p.com) : '—'}</td>` : ''}</tr>`).join('')}
    </tbody></table></div></section>`;
}
function cardOrigensRede(todos) {
  const m = new Map();
  todos.forEach(c => noPer(c.L, per[0], per[1]).forEach(x => { const n = c.o[x[1]] || 'Sem origem'; if (!m.has(n)) m.set(n, []); m.get(n).push(x); }));
  const rows = [...m.entries()].map(([n, ls]) => ({ n, t: agreg(ls) })).sort((a, b) => b.t.l - a.t.l);
  if (!rows.length) return '';
  return `<section class="card"><div class="chead">${icon('layers')}<h3>Origem dos leads da rede<small>De onde vieram os leads e quanto cada origem rendeu</small></h3></div>
    <div class="tbl"><table class="torig"><thead><tr><th>Origem</th><th class="n">Leads</th><th class="n op">Compar.</th><th class="n">Fech.</th><th class="n">Conversão</th><th class="n">Faturamento</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><b>${esc(r.n)}</b></td><td class="n">${num(r.t.l)}</td><td class="n op">${num(r.t.cp)}</td><td class="n">${num(r.t.c)}</td><td class="n">${pf(pct(r.t.c, r.t.l))}</td><td class="n" style="color:var(--gold2)">${brl(r.t.v)}</td></tr>`).join('')}
    </tbody></table></div></section>`;
}

/* ---------- Páginas ---------- */
function render() {
  const c = cl(); if (!c) { $('conteudo').innerHTML = '<section class="card"><p class="vazio">Ainda não há números liberados para você. Fale com a gestão.</p></section>'; return; }
  const temEu = c.eu >= 0, rede = P.perfil === 'rede', ger = P.perfil === 'gerente' || rede;
  const ABAS = rede ? [['rede', 'Rede'], ['clinica', 'Clínica'], ['equipe', 'Equipe']] : [['resumo', 'Resumo'], temEu ? ['meus', 'Meus leads'] : null, ['clinica', 'Clínica'], ger ? ['equipe', 'Equipe'] : null].filter(Boolean);
  if (!ABAS.some(a => a[0] === aba)) aba = ABAS[0][0];
  $('clinSel').hidden = (P.clinicas || []).length < 2 || aba === 'rede';
  $('abas').innerHTML = ABAS.map(([k, n]) => `<button type="button" role="tab" aria-selected="${k === aba}" class="${k === aba ? 'on' : ''}" data-aba="${k}">${n}</button>`).join('');
  $('perBtn').innerHTML = `${icon('cal')}<span style="min-width:0"><small>Período · toque para mudar</small><b>${esc(perNome ? perNome + ' · ' : '')}${rotPer()}</b></span><span class="chev">▾</span>`;
  const Lc = noPer(c.L, per[0], per[1]), A = anterior(), Lca = A ? noPer(c.L, A[0], A[1]) : null;
  const Le = temEu ? Lc.filter(x => x[2] === c.eu) : [], Lea = temEu && Lca ? Lca.filter(x => x[2] === c.eu) : null;
  const tc = agreg(Lc), tca = Lca ? agreg(Lca) : null, te = agreg(Le), tea = Lea ? agreg(Lea) : null;
  let h = '';
  if (aba === 'rede') {
    const todos = P.clinicas, Lr = todos.flatMap(x => noPer(x.L, per[0], per[1])), Lra = A ? todos.flatMap(x => noPer(x.L, A[0], A[1])) : null;
    h += `<div class="ola"><h2>Olá, ${esc(String(P.nome).split(' ')[0])}!</h2><p>Rede Meu Dente · ${todos.length} clínicas · dados do Dontus até ${fmt(maxOff(), true)} · atualizado em ${esc(P.atualizadoEm)}</p></div>`;
    h += `<a class="cklink" href="cockpit/"><span><b>Abrir o Cockpit completo</b><small>O painel inteiro da rede, igual ao do Claude: funil, origens, CRC e comissões, metas, histórico. Entra com o mesmo usuário e senha.</small></span><i aria-hidden="true">→</i></a>`;
    h += cardClinica(c, agreg(Lr), Lra ? agreg(Lra) : null, 'Rede Meu Dente');
    h += cardTabelaClinicas(todos, A);
    h += grafDias(Lr, 'Leads da rede por dia', rotPer());
    h += cardRankingRede(todos);
    h += `<div class="g2">${cardOrigensRede(todos)}${cardPendencias(agreg(Lr), 'Leads em aberto na rede', 'Leads deste período que ainda não fecharam')}</div>`;
  } else if (aba === 'resumo') {
    h += `<div class="ola"><h2>Olá, ${esc(String(P.nome).split(' ')[0])}!</h2><p>Dados do Dontus até ${fmt(maxOff(), true)} · atualizado em ${esc(P.atualizadoEm)}</p></div>`;
    if (temEu) h += `<div class="g2 l">${cardEu(c, te, tea)}${cardComissao(c, te)}</div>`;
    h += cardClinica(c, tc, tca);
    h += temEu ? cardPendencias(te, 'Meus leads em aberto', 'Leads seus deste período que ainda não fecharam') : cardPendencias(tc, 'Leads em aberto na clínica', 'Leads deste período que ainda não fecharam');
  } else if (aba === 'meus') {
    h += grafDias(Le, 'Meus leads por dia', rotPer());
    h += `<div class="g2">${cardFunil(te, 'Meu funil')}${cardEtapas(c, Le, 'Etapa dos meus leads')}</div>`;
    h += cardOrigens(c, Le, 'Meus leads por origem');
    h += cardAgenda(c.L.filter(x => x[2] === c.eu), 'Meus próximos agendamentos');
  } else if (aba === 'clinica') {
    h += cardClinica(c, tc, tca);
    h += grafDias(Lc, 'Leads da clínica por dia', rotPer());
    h += `<div class="g2">${cardFunil(tc, 'Funil da clínica')}${cardEtapas(c, Lc, 'Etapa dos leads da clínica')}</div>`;
    h += cardOrigens(c, Lc, 'Origem dos leads da clínica');
    h += cardAgenda(c.L, 'Próximos agendamentos da clínica');
  } else if (aba === 'equipe') {
    h += cardEquipe(c, Lc, Lca);
  }
  h += '<p class="fim">Números do sistema Dontus One, atualizados pela gestão. Dúvidas sobre os valores? Fale com a gestão da sua clínica.</p>';
  $('conteudo').innerHTML = h;
}
function iniciar() {
  D0 = deIso(P.min);
  const pr = presets(); per = pr[0][2].slice(); perNome = pr[0][1];
  $('telaLogin').hidden = true; $('telaPainel').hidden = false;
  $('quemNome').textContent = P.nome;
  $('quemPer').textContent = P.perfil === 'rede' ? 'Gestão da rede' : P.perfil === 'gerente' ? 'Gestão da clínica' : 'Equipe comercial';
  aba = P.perfil === 'rede' ? 'rede' : 'resumo';
  const cs = P.clinicas || [];
  $('clinSel').innerHTML = cs.map((c, i) => `<option value="${i}">${esc(c.nome)}</option>`).join('');
  $('clinSel').value = String(ci);
  render(); window.scrollTo(0, 0);
}

/* ---------- Folha do período (atalhos + calendário) ---------- */
function abrirFolha() { calSel = per.slice(); const d = diaD(per[1]); calMes = [d.getFullYear(), d.getMonth()]; desenharFolha(); $('veu').hidden = false; $('folha').hidden = false; }
function fecharFolha() { $('veu').hidden = true; $('folha').hidden = true; }
function desenharFolha() {
  const mx = maxOff(), [y, m] = calMes, pri = new Date(y, m, 1), ult = new Date(y, m + 1, 0).getDate();
  const minM = [D0.getFullYear(), D0.getMonth()], maxD = diaD(mx), maxM = [maxD.getFullYear(), maxD.getMonth()];
  const podeAnt = y * 12 + m > minM[0] * 12 + minM[1], podeProx = y * 12 + m < maxM[0] * 12 + maxM[1];
  let g = DSEM.map(d => `<span class="ds">${d}</span>`).join('') + '<span></span>'.repeat(pri.getDay());
  for (let d = 1; d <= ult; d++) {
    const o = offD(new Date(y, m, d)), fora = o < 0 || o > mx;
    const [a, b] = calSel; const ex = o === a || o === b, dentro = b != null && o > a && o < b;
    g += `<button type="button" data-dia="${o}"${fora ? ' disabled' : ''} class="${ex ? 'ex' : dentro ? 'in' : ''}${o === mx ? ' hj' : ''}">${d}</button>`;
  }
  const pr = presets();
  $('folha').innerHTML = `<h3 id="folhaTit">Escolha o período</h3>
    <div class="presets">${pr.map(([k, n, r]) => `<button type="button" data-pre="${k}" class="${r[0] === per[0] && r[1] === per[1] ? 'on' : ''}">${n}</button>`).join('')}</div>
    <div class="cal"><div class="calh"><button type="button" data-mes="-1"${podeAnt ? '' : ' disabled'} aria-label="Mês anterior">‹</button><b>${MESES[m][0].toUpperCase() + MESES[m].slice(1)} de ${y}</b><button type="button" data-mes="1"${podeProx ? '' : ' disabled'} aria-label="Próximo mês">›</button></div><div class="calg">${g}</div></div>
    <p class="selinfo">${calSel[1] == null ? 'Agora toque no último dia.' : `Selecionado: ${calSel[0] === calSel[1] ? fmt(calSel[0], true) : fmt(calSel[0]) + ' a ' + fmt(calSel[1], true)}. Toque em um dia para começar de novo.`} Há dados de ${fmt(0, true)} a ${fmt(mx, true)}.</p>
    <div class="acoes"><button class="btn sm" type="button" data-fx="cancelar">Cancelar</button><button class="btn sm gold" type="button" data-fx="aplicar"${calSel[1] == null ? ' disabled' : ''}>Ver este período</button></div>`;
}
$('folha').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.pre) { const p = presets().find(x => x[0] === b.dataset.pre); per = p[2].slice(); perNome = p[1]; fecharFolha(); render(); return; }
  if (b.dataset.mes) { const [y, m] = calMes; const d = new Date(y, m + +b.dataset.mes, 1); calMes = [d.getFullYear(), d.getMonth()]; desenharFolha(); return; }
  if (b.dataset.dia != null) { const o = +b.dataset.dia; if (calSel[1] == null && o >= calSel[0]) calSel = [calSel[0], o]; else calSel = [o, null]; desenharFolha(); return; }
  if (b.dataset.fx === 'cancelar') { fecharFolha(); return; }
  if (b.dataset.fx === 'aplicar' && calSel[1] != null) { per = calSel.slice(); perNome = ''; fecharFolha(); render(); }
});
$('veu').addEventListener('click', fecharFolha);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('folha').hidden) fecharFolha(); });
$('perBtn').addEventListener('click', abrirFolha);
$('clinSel').addEventListener('change', (e) => { ci = +e.target.value; render(); });
$('conteudo').addEventListener('click', (e) => { const r = e.target.closest('[data-ir]'); if (!r) return; ci = +r.dataset.ir; aba = 'clinica'; $('clinSel').value = String(ci); render(); window.scrollTo({ top: 0 }); });
$('conteudo').addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-ir]')) { e.preventDefault(); e.target.click(); } });
$('abas').addEventListener('click', (e) => { const b = e.target.closest('[data-aba]'); if (!b) return; aba = b.dataset.aba; render(); window.scrollTo({ top: 0 }); });
$('formLogin').addEventListener('submit', entrar);
$('sair').addEventListener('click', sair);
const olho = $('olho'); olho.innerHTML = icon('eye');
olho.addEventListener('click', () => { const v = $('senha').type === 'password'; $('senha').type = v ? 'text' : 'password'; olho.innerHTML = icon(v ? 'eyeOff' : 'eye'); olho.setAttribute('aria-label', v ? 'Esconder senha' : 'Mostrar senha'); });
voltarSalvo().then(ok => { if (ok) iniciar(); else $('usuario').focus(); });
})();
</script>
